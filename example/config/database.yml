# PostgreSQL, on 127.0.0.1:5432 as postgres/postgres unless PGHOST, PGPORT, PGUSER
# and PGPASSWORD say otherwise. DATABASE_URL replaces it: CI runs the suite again
# on MySQL with a trilogy:// one.
#
# Not `encoding: unicode`: it would reach MySQL too, which knows no such charset,
# and PostgreSQL creates UTF-8 databases by default.
default: &default
  adapter: postgresql
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("PGHOST") { "127.0.0.1" } %>
  port: <%= ENV.fetch("PGPORT") { 5432 } %>
  username: <%= ENV.fetch("PGUSER") { "postgres" } %>
  password: <%= ENV.fetch("PGPASSWORD") { "postgres" } %>

development:
  <<: *default
  database: lighthouse_example_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: lighthouse_example_test

production:
  <<: *default
  database: lighthouse_example_production
