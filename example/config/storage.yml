# Where ActiveStorage keeps files: what @upload stores (see app/graphql and
# docs/directives.md#upload). The test service writes under tmp/.
test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# A public service (anyone may read its files): what @upload(public: true) needs.
test_public:
  service: Disk
  root: <%= Rails.root.join("tmp/storage_public") %>
  public: true
