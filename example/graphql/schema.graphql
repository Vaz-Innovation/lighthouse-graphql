# The API of a small blog, written the Lighthouse way: the schema says what each
# field does through directives, and Ruby is only written where there is real
# logic (app/graphql/queries, mutations, builders, validators; app/policies).
# Every *.graphql file in this folder is part of the schema.
# Directives reference: ../docs/directives.md

type Query {
  "The signed-in user — resolved by Resolvers::Me. Requires `Authorization: Bearer <token>`."
  me: User! @guard

  "Find a user by id."
  user(id: ID! @eq): User @find

  "Users, a page at a time, optionally filtered by name."
  users(name: String @like, orderBy: [UserOrderByClause!] @orderBy): [User!]! @paginate(defaultCount: 10)

  "Published posts, newest first, with dynamic filters. A public, CDN-cacheable list."
  posts(
    where: _ @whereConditions(columns: ["title", "author_id"])
    orderBy: [PostOrderByClause!] @orderBy
    "Posts whose metadata.labels holds this label (@whereJsonContains, on SQLite, PostgreSQL and MySQL)."
    label: String @whereJsonContains(key: "metadata->labels")
    "Posts whose metadata.labels holds every one of these."
    labels: [String!] @whereJsonContains(key: "metadata->labels")
  ): [Post!]! @paginate(defaultCount: 10) @builder(class: "Published") @cacheControl(maxAge: 60)

  "The same posts as a Relay-style connection."
  feed: [Post!]! @paginate(type: CONNECTION, defaultCount: 5) @builder(class: "Published") @cacheControl(maxAge: 60)

  "A single published post."
  post(id: ID! @eq): Post @find(scopes: ["published"]) @cacheControl(maxAge: 30)

  "How many posts are published."
  publishedPostCount: Int! @count(model: "Post", scopes: ["published"])

  "Every tag. Kept in Rails.cache for five minutes; createTag clears it."
  tags: [Tag!]! @all @cache(maxAge: 300) @cacheControl(maxAge: 300)

  "Full-text-ish search over published posts — resolved by Resolvers::SearchPosts. Ten a minute per IP (@throttle), a 429 past that."
  searchPosts(term: String!): [Post!]! @throttle(maxAttempts: 10)

  "The tags on the most published posts — resolved by Resolvers::Tags::Popular, which @field names."
  popularTags(limit: Int = 5): [Tag!]! @field(resolver: "Tags::Popular")

  "Published posts and users matching a term — resolved by Resolvers::Search. Each result is a Post or a User."
  search(term: String!): [SearchResult!]!

  "The newest published posts and comments on them, optionally since a time — resolved by Resolvers::LatestActivity."
  latestActivity(first: Int = 10, since: DateTime): [Authored!]!

  "How many of each there are — Resolvers::Statistics#counts, which @field names after the @."
  counts: Counts! @field(resolver: "Statistics@counts")

  """
  The signed-in user's posts, drafts included. Resolvers::MyPosts builds the query, and
  resolve_info.enhance_builder applies this field's @like and @orderBy to it.
  """
  myPosts(title: String @like, orderBy: [PostOrderByClause!] @orderBy): [Post!]! @guard

}

type Mutation {
  "Create an account. Validators::Mutation::SignUpValidator checks the arguments first."
  signUp(name: String!, email: String!): User! @create @validator

  "Write a post as the signed-in user, tagging it in the same request (a nested mutation)."
  createPost(input: CreatePostInput! @spread): Post!
    @guard
    @canModel(ability: "create")
    @create
    @inject(context: "current_user.id", name: "author_id")
    @broadcast(subscription: "postCreated")

  "Edit a post. Only its author or an admin may (PostPolicy#update?)."
  updatePost(input: UpdatePostInput! @spread): Post!
    @guard
    @canFind(ability: "update", find: "input.id")
    @update
    @clearCache(type: "Post", idSource: { argument: "input.id" })

  "Delete a post (PostPolicy#destroy?)."
  deletePost(id: ID! @whereKey): Post @guard @canFind(ability: "destroy", find: "id") @delete

  "Publish a post — resolved by Mutations::PublishPost."
  publishPost(id: ID!): Post! @guard @canFind(ability: "publish", find: "id") @broadcast(subscription: "postPublished")

  """
  Publish a post from the queue: @guard and @canFind decide now, and Mutations::PublishPost, which
  @field names, runs in a Solid Queue job (@async). Answers true once the job is queued.
  """
  schedulePublish(id: ID!): Boolean! @guard @canFind(ability: "publish", find: "id", model: "Post") @async @field(resolver: "PublishPost")

  "Comment on a post as the signed-in user."
  addComment(postId: ID! @rename(attribute: "post_id"), body: String!): Comment!
    @guard
    @create
    @inject(context: "current_user.id", name: "author_id")
    @broadcast(subscription: "commentAdded")

  "Add a tag, and drop the cached tag list. Twenty a minute per user, past which GraphqlController#too_many_requests answers."
  createTag(name: String!): Tag!
    @throttle(maxAttempts: 20, by: "current_user.id", with: "too_many_requests")
    @guard
    @create
    @clearCache(type: "Query", field: "tags")

  """
  Set the signed-in user's avatar, sent as a multipart request (the GraphQL multipart request
  specification). @upload stores the file with ActiveStorage, under avatars/, and passes its
  blob's signed id, which @update attaches to User#avatar.
  """
  updateAvatar(avatar: Upload! @upload(path: "avatars")): User!
    @guard
    @update
    @inject(context: "current_user.id", name: "id")
}

"A file sent with a multipart request. Lighthouse reads it (Lighthouse::GraphQL::Upload)."
scalar Upload

type Counts {
  posts: Int!
  users: Int!
  comments: Int!
}

# Subscriptions arrive over ActionCable (app/channels/graphql_channel.rb). Each is a
# GraphQL::Schema::Subscription in app/graphql/subscriptions (postCreated is plain
# graphql-ruby, postPublished and commentAdded include Lighthouse's concern), and a mutation
# announces what it did with @broadcast. Guide: ../docs/subscriptions.md
type Subscription {
  "A post was written: drafts reach their author and admins only. Requires a token."
  postCreated: Post!

  "A post went public, optionally only by one author."
  postPublished(authorId: ID): Post!

  "A comment was added: to any post, or only to the post given."
  commentAdded(postId: ID): Comment!
}
