inherit_from: ../.rubocop.yml

# Benchmarks: scripts run by hand that build their own models and data, and
# print a table. Not the gem's code.
Style/OneClassPerFile:
  Enabled: false
Rails/ApplicationRecord:
  Enabled: false
Rails/SkipsModelValidations:
  Enabled: false
Style/FormatStringToken:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Metrics/AbcSize:
  Enabled: false
