name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Not ubuntu-latest: setup-ruby has no Ruby 3.1 build for Ubuntu 26.04 (the
    # new latest), and the matrix below still covers 3.1.
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        # The gemspec requires >= 3.0; every supported line is exercised.
        ruby-version: ['3.1', '3.2', '3.3', '3.4']

    steps:
      - uses: actions/checkout@v5

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          # No Gemfile.lock is committed — a library resolves against its
          # gemspec, so each Ruby in the matrix resolves its own dependency set.
          bundler-cache: true

      - name: Test
        run: bundle exec rspec

      - name: Build the gem
        run: bundle exec rake build

      # A gemspec that builds can still ship an incomplete package: `spec.files`
      # is an explicit `Dir[...]` allowlist, so anything added outside those
      # globs — a template under lib/, a new docs subtree — is left out
      # silently, and only breaks in someone else's Gemfile. Unpacking the
      # built gem and diffing it against the tracked sources catches that here.
      - name: The package must contain every tracked source file
        run: |
          version="$(ruby -Ilib -e 'require "lighthouse/graphql/version"; print Lighthouse::GraphQL::VERSION')"
          gem unpack "pkg/lighthouse-graphql-$version.gem" --target "$RUNNER_TEMP/unpacked"
          missing="$(comm -23 \
            <(git ls-files lib sig docs README.md CHANGELOG.md LICENSE.txt | sort) \
            <(cd "$RUNNER_TEMP/unpacked/lighthouse-graphql-$version" && find . -type f | sed 's|^\./||' | sort))"
          if [ -n "$missing" ]; then
            echo "::error::these tracked files are not in the built gem — widen spec.files:"
            echo "$missing"
            exit 1
          fi
          echo "package contains every tracked source file"

  # The gemspec allows graphql ~> 2.5, and the jobs above resolve the newest
  # release, so the oldest minor is exercised here. graphql 2.5 passes
  # `quirks_mode:` to JSON.generate, which json 3 no longer accepts: it runs
  # with json 2, as apps on graphql 2.5 must.
  graphql-2-5:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Pin graphql 2.5
        run: printf "gem 'graphql', '~> 2.5.0'\ngem 'json', '< 3'\n" >> Gemfile

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Test
        run: bundle exec rspec

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      # One configuration for the gem and the example app (example/.rubocop.yml inherits it).
      - name: RuboCop
        run: bundle exec rubocop

      # sig/ ships in the gem: it must parse and name only types that exist, and
      # agree with what the code is actually called with and returns — the suite
      # runs with every Lighthouse method checked against its signature.
      - name: RBS signatures
        run: bundle exec rake rbs

  example:
    runs-on: ubuntu-latest

    # The example Rails app is the end-to-end suite: its specs drive the real
    # /graphql endpoint through the gem in this checkout (`path: '..'`), on a
    # PostgreSQL that spec/postgres_container.rb starts with Testcontainers (the
    # runner's Docker), on a port Docker picks, and loads db/schema.rb into.
    defaults:
      run:
        working-directory: example

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: example

      - name: End-to-end tests
        run: bundle exec rspec

      - name: Persisted queries match the schema
        run: bin/rails lighthouse:persisted_queries:verify

  example-databases:
    runs-on: ubuntu-latest

    # The end-to-end suite again, with a Redis cache store and OpenSearch, on the
    # service's PostgreSQL and on MySQL (DATABASE_URL, so no Testcontainers): SQL
    # that differs per database (@whereJsonContains, the batched relation queries),
    # Solid Queue for @async, and @throttle's counts
    # (spec/requests/graphql/real_backends_spec.rb); and Searchkick's @search
    # (spec/requests/graphql/search_spec.rb, whose pg_search cases MySQL skips).
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: postgresql
            url: postgres://postgres:postgres@127.0.0.1:5432/lighthouse_example_test
          - database: mysql
            url: trilogy://root:root@127.0.0.1:3306/lighthouse_example_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -proot" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      opensearch:
        image: opensearchproject/opensearch:2
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: 'true'
          DISABLE_INSTALL_DEMO_CONFIG: 'true'
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ['9200:9200']
        options: --health-cmd "curl -sf localhost:9200" --health-interval 10s --health-timeout 5s --health-retries 20

    env:
      RAILS_ENV: test
      DATABASE_URL: ${{ matrix.url }}
      REDIS_URL: redis://127.0.0.1:6379/0
      OPENSEARCH_URL: http://127.0.0.1:9200

    defaults:
      run:
        working-directory: example

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: example

      - name: Prepare the ${{ matrix.database }} test database
        run: bin/rails db:create db:schema:load

      - name: End-to-end tests on ${{ matrix.database }}
        run: bundle exec rspec
